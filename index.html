<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Confess 🤍</title>
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  background: radial-gradient(circle at top, #1a1a1a, #000);
  color: white;
  transition: background 0.3s, color 0.3s;
}
body.light {
  background: radial-gradient(circle at top, #eee, #ccc);
  color: #111;
}
.card {
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  padding: 20px;
  width: 400px;
  margin: 10px 0;
  transition: background 0.3s;
}
body.light .card {
  background: rgba(255,255,255,0.3);
}
textarea, input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 14px;
  transition: background 0.3s, color 0.3s;
}
body.light textarea, body.light input {
  background: rgba(255,255,255,0.5);
  color: #111;
}
button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #ff0080, #7928ca);
  color: white;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #ff0080;
}
.message-card {
  background: #111;
  padding: 12px;
  border-radius: 12px;
  margin: 8px 0;
  transition: background 0.3s, color 0.3s;
}
body.light .message-card {
  background: #eee;
  color: #111;
}
a { color:#ff4d6d; text-decoration:none; }
.status { font-weight:bold; padding:2px 6px; border-radius:6px; font-size:12px; }
.status.pending { background:#ffa500; color:#111; }
.status.approved { background:#28a745; color:#fff; }
.status.rejected { background:#dc3545; color:#fff; }
.status.edited { background:#17a2b8; color:#fff; }
</style>
</head>
<body>

<!-- User Submission Card -->
<div class="card">
  <h2>Drop your secret 🤍</h2>
  <textarea id="msg" placeholder="Type your confession..."></textarea>
  <input type="text" id="insta" placeholder="Your Instagram ID (optional)">
  <p style="font-size:12px;opacity:0.7;">If you want a reply, mention your Insta ID 💌</p>
  <button onclick="send()">Send 💌</button>
  <button onclick="toggleMode()">Toggle Light/Dark 🌗</button>
</div>

<!-- Admin Dashboard -->
<h2>Messages (Admin View) 🤍 <span id="count"></span></h2>
<div id="list" style="width:400px;"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script>
  // 🔹 Replace with your Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyDtbHkEBA9aUQISb-u84BUJnJZACr9Thk8",
    authDomain: "confess-4ce02.firebaseapp.com",
    projectId: "confess-4ce02",
    storageBucket: "confess-4ce02.appspot.com",
    messagingSenderId: "511380243224",
    appId: "1:511380243224:web:073e458923ef35e5c0146d"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Generate UID
  let userId = localStorage.getItem("uid");
  if(!userId){
    userId = "user_" + Math.random().toString(36).substr(2,9);
    localStorage.setItem("uid", userId);
  }

  // Send confession
  function send(){
    let text = document.getElementById("msg").value.trim();
    let insta = document.getElementById("insta").value.trim();
    if(text === ""){
      alert("You cannot send an empty confession 😅");
      return;
    }
    db.collection("confessions").add({
      message: text,
      insta: insta,
      uid: userId,
      status: "pending",
      time: new Date()
    }).then(()=>{
      document.getElementById("msg").value = "";
      document.getElementById("insta").value = "";
      alert("Confession sent! 💌");
    });
  }

  // Copy for story
  function copyForStory(msg){
    navigator.clipboard.writeText(msg).then(()=>{
      alert("Message copied! Paste it in your story 🎉");
    });
  }

  // Update status
  function updateStatus(id, status){
    db.collection("confessions").doc(id).update({status: status});
  }

  // Display messages (Admin View)
  function displayMessages(){
    db.collection("confessions").orderBy("time","desc").onSnapshot(snapshot=>{
      let list = document.getElementById("list");
      list.innerHTML = "";
      snapshot.forEach(doc=>{
        let data = doc.data();
        let div = document.createElement("div");
        div.className = "message-card";

        let instaLink = data.insta ? `<a href="https://instagram.com/${encodeURIComponent(data.insta)}" target="_blank">${data.insta}</a>` : "Anonymous";
        let statusBadge = `<span class="status ${data.status}">${data.status}</span>`;
        let timeString = data.time ? data.time.toDate().toLocaleString() : "Unknown time";

        div.innerHTML = `
          <p>${data.message}</p>
          <small>👤 UID: ${data.uid}</small><br>
          <small>📸 ${instaLink}</small> | ${statusBadge}<br>
          <small>🕒 ${timeString}</small><br>
          <button onclick="updateStatus('${doc.id}','approved')">✅ Approve</button>
          <button onclick="updateStatus('${doc.id}','rejected')">❌ Reject</button>
          <button onclick="updateStatus('${doc.id}','edited')">✏️ Edit</button>
          <button onclick="copyForStory('${data.message.replace(/'/g,"\\'")}')">📋 Copy for Story</button>
        `;
        list.appendChild(div);
      });
      document.getElementById("count").innerText = snapshot.size;
    });
  }

  // Light/Dark toggle
  function toggleMode(){
    document.body.classList.toggle("light");
    localStorage.setItem("mode", document.body.classList.contains("light") ? "light" : "dark");
  }
  if(localStorage.getItem("mode") === "light") document.body.classList.add("light");

  // Initial load
  displayMessages();
</script>
</body>
</html>
